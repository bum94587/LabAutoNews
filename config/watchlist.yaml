# Topics and companies a run should recognise. Slugs are used as the `segment` field on items.

# Whose brief this is: a DMPK / ADME scientist in drug discovery. Their field is the primary
# lens, but any lab automation relevant to pharma & biotech is in scope. Don't narrow too far.
focus:
  primary:
    name: DMPK / ADME automation in drug discovery
    segment: dmpk-adme
    keywords: [ADME, DMPK, drug metabolism, pharmacokinetics, metabolic stability, liver microsomes,
               hepatocytes, intrinsic clearance, CYP inhibition, CYP induction, plasma protein binding,
               permeability, Caco-2, MDCK, PAMPA, solubility, lipophilicity, logD, transporter assays,
               bioanalysis, LC-MS/MS, sample preparation, PK sample analysis, metabolite identification,
               in vitro-in vivo extrapolation, DMTA cycle]
    relevance: +1 to the researcher's relevance guess (cap 5); papers in this field are listed first
  in_scope: Any laboratory automation relevant to pharma & biotech, from discovery and screening to bioanalysis, cell/gene therapy and QC
  lower_priority: Self-driving labs in materials, chemistry or physics with no clear transfer to pharma (keep them, rate relevance 1 lower)

segments:
  dmpk-adme: DMPK / ADME automation (primary focus)
  liquid-handling: Liquid handling & benchtop automation
  robotics-workcells: Robotic arms, mobile lab robots, integrated workcells, storage
  self-driving-labs: Self-driving labs / autonomous discovery / AI scientists
  software-orchestration: Scheduling, orchestration, LIMS/ELN, data & device integration
  cloud-labs: Cloud labs & lab-as-a-service
  clinical-automation: Clinical & diagnostic lab automation
  standards: Standards & interoperability (SiLA 2, LADS / OPC UA, Allotrope)
  business: Funding, M&A, partnerships, leadership, market
  community-events: Conferences, user groups, community discussion
  open-hardware: Open-source hardware and DIY lab instruments

item_types: [product, partnership, funding, acquisition, event, research, community, standards, people, market, other]

companies:
  core_vendors: [Hamilton, Tecan, Agilent, Beckman Coulter]
  incumbents: [Thermo Fisher, Revvity, Molecular Devices, Eppendorf, Sartorius, Roche Diagnostics, Siemens Healthineers, Abbott, Waters, SPT Labtech, Formulatrix, Analytik Jena, Gilson, INTEGRA Biosciences]
  open_source: [PyLabRobot]
  growth: [Opentrons, Automata, Biosero, HighRes Biosolutions, Synthace, Benchling, Emerald Cloud Lab, Ginkgo Bioworks, Cellares, Retisoft, Unchained Labs]
  ai_native: [Lila Sciences, Periodic Labs, Chemify, Radical AI, Medra, Trilobio, FutureHouse, Arctoris, Recursion]

keywords: ["lab automation", "laboratory automation", "liquid handler", "liquid handling robot",
           "self-driving lab", "autonomous laboratory", "laboratory robotics", "cloud lab",
           "AI scientist", "workcell", "lab orchestration", "SiLA 2", "LADS OPC UA"]

events:
  - SLAS International (annual, ~Jan/Feb, US)
  - SLAS Europe (annual, ~May)
  - ELRIG Drug Discovery (annual, ~Oct, UK)
  - LRIG chapter meetings and vendor shows (year-round)
  - ADLM (clinical lab, ~Jul)
