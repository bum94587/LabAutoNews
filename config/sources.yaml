# Where every research run looks, in priority order.
#
# tier: core      -> always checked (on its cadence), no exceptions
#       secondary -> checked when core sources are thin, or to corroborate
# cadence: daily (default) | weekly -> weekly sources (journals, PubMed) are checked on the
#       Monday run only, looking back 14 days because articles are indexed with a lag
#
# Each source can be read two ways:
#   1. `fetch:` - fetched directly by `uv run fetch_sources.py` (needs the domain allowed in
#      the environment's network settings; failures are logged, never fatal)
#      Types: discourse | rss | html-links | git-log (merged PRs + tags of a public repo) |
#      crossref-journal (new articles by ISSN; needs api.crossref.org allowed) |
#      pubmed (E-utilities queries; needs eutils.ncbi.nlm.nih.gov allowed).
#      `fetch:` can be one block or a list of blocks.
#   2. `search:` - site-restricted web searches the research run makes with WebSearch
#      (allowed_domains = search.domains). This always works and is the fallback.
#
# Vendors are huge companies selling across all of life sciences, so for them we only look at
# lab-automation sections and keep an item only if it matches `include` (case-insensitive
# substrings) and none of `exclude`.

sources:
  # ---------------------------------------------------------------- community & societies
  - id: labautomation-io
    name: Labautomation.io (community forum)
    tier: core
    kind: community
    home: https://labautomation.io
    fetch:
      type: discourse          # Discourse forum: JSON API with topic list
      url: https://labautomation.io/latest.json
    search:
      domains: [labautomation.io]
      queries:
        - "labautomation.io new topic"
        - "liquid handler"
        - "PyLabRobot"
        - "scheduler orchestration"

  - id: pylabrobot
    name: PyLabRobot (open-source lab automation library)
    tier: core
    kind: community
    home: https://github.com/PyLabRobot/pylabrobot
    fetch:
      - type: git-log            # merged PRs + release tags via git (GitHub web/API is blocked)
        url: https://github.com/PyLabRobot/pylabrobot
        days: 14
      - type: discourse          # the PyLabRobot category on labautomation.io
        url: https://labautomation.io/c/pylabrobot/23.json
    search:
      domains: [github.com, docs.pylabrobot.org, labautomation.io, pylabrobot.org]
      queries:
        - "PyLabRobot release"
        - "PyLabRobot new device backend support"
        - "PyLabRobot paper OR talk OR workshop"
    notes: >-
      Report as one weekly roll-up item ("PyLabRobot this week": new devices/backends, notable
      fixes, releases), not one item per PR. Separate items only for releases, papers or
      announcements.

  - id: slas
    name: SLAS (Society for Laboratory Automation and Screening)
    tier: core
    kind: society
    home: https://www.slas.org/news-highlights/news-center/
    fetch:
      type: html-links
      url: https://www.slas.org/news-highlights/news-center/2026-news-releases/
      link_pattern: '/news-highlights/news-center/20\d\d-news-releases/[^/]+/?$'
    search:
      domains: [slas.org]
      queries:
        - "SLAS news release"
        - "SLAS Technology journal"
        - "SLAS Discovery"
        - "SLAS2027"

  - id: lrig
    name: LRIG (Laboratory Robotics Interest Group) and chapters
    tier: core
    kind: society
    home: https://www.lrig.org
    fetch:
      type: html-links
      url: https://www.lrig.org
      link_pattern: '(event|meeting|chapter|news)'
    search:
      domains: [lrig.org, sites.google.com]
      queries:
        - "Laboratory Robotics Interest Group meeting"
        - "LRIG chapter event vendor exhibition"
        - "Laboratory Robotics New England"

  - id: elrig
    name: ELRIG (European Laboratory Research & Innovation Group)
    tier: core
    kind: society
    home: https://www.elrig.org
    fetch:
      type: html-links
      url: https://www.elrig.org/news/
      link_pattern: '/(news|events?|portfolio)/[^/]+/?$'
    search:
      domains: [elrig.org]
      queries:
        - "ELRIG Drug Discovery"
        - "ELRIG research and innovation automation"

  # ---------------------------------------------------------------- vendors (automation only)
  - id: hamilton
    name: Hamilton Company (Robotics / liquid handling)
    tier: core
    kind: vendor
    home: https://www.hamiltoncompany.com/automated-liquid-handling
    fetch:
      type: html-links
      url: https://www.hamiltoncompany.com/press-releases
      link_pattern: '/press-releases/[^/]+/?$'
    search:
      domains: [hamiltoncompany.com]
      queries:
        - "Hamilton Microlab STAR VANTAGE NIMBUS press release"
        - "Hamilton automated liquid handling news"
        - "Hamilton automated storage robotics"
    include: [automat, robot, liquid handl, microlab, star, vantage, nimbus, prep, venus, storage, workcell, pipett, integration, slas]
    exclude: [ph sensor, dissolved oxygen, syringe only, gas chromatography, process analytics]

  - id: tecan
    name: Tecan (lab automation)
    tier: core
    kind: vendor
    home: https://www.tecan.com/news-archive
    fetch:
      type: html-links
      url: https://www.tecan.com/news-archive
      link_pattern: '/(corporate-news|customer-news)/[^/]+$'
    search:
      domains: [tecan.com, lifesciences.tecan.com]
      queries:
        - "Tecan Fluent Veya automation news"
        - "Tecan launches automation"
        - "Tecan liquid handling partnership"
    include: [automat, robot, liquid handl, fluent, veya, freedom evo, d300, workcell, introspect, labwerx, partner, launch, slas, acquisition]
    exclude: [half-year report, annual general meeting, dividend, share buyback]

  - id: agilent
    name: Agilent (automation & liquid handling only)
    tier: core
    kind: vendor
    home: https://www.agilent.com/en/product/automated-liquid-handling
    fetch:
      type: html-links
      url: https://www.agilent.com/about/newsroom/presrel/
      link_pattern: '/about/newsroom/presrel/20\d\d/[^/]+\.html$'
    search:
      domains: [agilent.com, investor.agilent.com]
      queries:
        - "Agilent Bravo automated liquid handling news"
        - "Agilent BioTek automation workcell"
        - "Agilent lab automation announces"
    include: [automat, robot, liquid handl, bravo, biotek, vworks, workcell, magnis, slas, high-throughput]
    exclude: [chromatography, mass spectrometry, spectroscopy, dividend, earnings, quarterly results, gc/ms, lc/ms]

  - id: beckman
    name: Beckman Coulter (Life Sciences automation + clinical lab automation)
    tier: core
    kind: vendor
    home: https://www.beckman.com/news
    fetch:
      type: html-links
      url: https://www.beckman.com/news
      link_pattern: '/news/[^/]+$'
    search:
      domains: [beckman.com, mybeckman.com]
      queries:
        - "Beckman Coulter Biomek news"
        - "Beckman Coulter Echo acoustic liquid handling news"
        - "Beckman Coulter DxA total lab automation"
    include: [automat, robot, liquid handl, biomek, echo, workcell, dxa, total lab, integration, slas]
    exclude: [flow cytometer only, centrifuge only, reagent kit only]

  # ---------------------------------------------------------------- journals & literature (weekly)
  # Papers are rendered in the brief's "From the journals" section. DMPK / ADME first (see the
  # focus block in watchlist.yaml), then any lab automation relevant to pharma & biotech.
  - id: slas-discovery
    name: SLAS Discovery (journal)
    tier: core
    cadence: weekly
    kind: journal
    home: https://www.sciencedirect.com/journal/slas-discovery
    fetch:
      type: crossref-journal
      issn: 2472-5552
      days: 14
    search:
      domains: [sciencedirect.com, slas-discovery.org]
      queries:
        - "SLAS Discovery articles in press"
        - "SLAS Discovery ADME OR DMPK OR metabolic stability OR permeability"
        - "SLAS Discovery high-throughput screening automation"

  - id: slas-technology
    name: SLAS Technology (journal)
    tier: core
    cadence: weekly
    kind: journal
    home: https://www.sciencedirect.com/journal/slas-technology
    fetch:
      type: crossref-journal
      issn: 2472-6303
      days: 14
    search:
      domains: [sciencedirect.com, slas-technology.org]
      queries:
        - "SLAS Technology articles in press"
        - "SLAS Technology laboratory automation"
        - "SLAS Technology self-driving laboratory"

  - id: hardwarex
    name: HardwareX (journal, open hardware)
    tier: core
    cadence: weekly
    kind: journal
    home: https://www.sciencedirect.com/journal/hardwarex
    fetch:
      type: crossref-journal
      issn: 2468-0672
      days: 14
    search:
      domains: [sciencedirect.com, hardware-x.com]
      queries:
        - "HardwareX laboratory automation"
        - "HardwareX liquid handling OR pipetting robot OR microplate"
        - "HardwareX open source laboratory instrument"
    include: [automat, liquid, pipett, robot, laborator, microplate, plate, sample, dispens, incubat, pump, fluidic, culture, assay, bioreactor, microscop, screening, spectro]

  - id: pubmed
    name: PubMed (DMPK/ADME automation first, then pharma/biotech lab automation)
    tier: core
    cadence: weekly
    kind: literature
    home: https://pubmed.ncbi.nlm.nih.gov/
    fetch:
      type: pubmed
      days: 14
      queries:
        # primary field: DMPK / ADME
        - '(ADME[tiab] OR DMPK[tiab] OR "drug metabolism"[tiab] OR pharmacokinetic*[tiab] OR "metabolic stability"[tiab] OR microsom*[tiab] OR hepatocyte*[tiab] OR "CYP inhibition"[tiab] OR "protein binding"[tiab] OR permeability[tiab] OR Caco-2[tiab] OR solubility[tiab] OR bioanalys*[tiab]) AND (automat*[tiab] OR "high-throughput"[tiab] OR robot*[tiab] OR "liquid handl*"[tiab] OR "acoustic dispens*"[tiab])'
        # broader: lab automation in pharma & biotech
        - '("laboratory automation"[tiab] OR "lab automation"[tiab] OR "liquid handling"[tiab] OR "self-driving lab*"[tiab] OR "autonomous lab*"[tiab] OR "laboratory robot*"[tiab] OR "automated workflow"[tiab]) AND (drug[tiab] OR pharma*[tiab] OR biotech*[tiab] OR assay*[tiab] OR screening[tiab])'
    search:
      domains: [pubmed.ncbi.nlm.nih.gov, pmc.ncbi.nlm.nih.gov]
      queries:
        - "automated ADME assay"
        - "high-throughput metabolic stability automation"
        - "automated DMPK workflow liquid handler"
        - "automated bioanalysis LC-MS/MS sample preparation"
        - "laboratory automation drug discovery"
    notes: >-
      Google Scholar is not used: it has no API, blocks automated queries, and web search does
      not index it. PubMed (plus the journal feeds) covers the peer-reviewed side; preprints
      come from the `research` source.

  # ---------------------------------------------------------------- secondary (corroboration, wider net)
  - id: trade-press
    name: Lab trade press
    tier: secondary
    kind: press
    search:
      domains: [selectscience.net, labmanager.com, genomeweb.com, technologynetworks.com, labiotech.eu, therobotreport.com, fiercebiotech.com, drugdiscoverynews.com]
      queries:
        - "laboratory automation"
        - "liquid handling robot launch"
        - "self-driving lab"
        - "lab automation funding raises"

  - id: linkedin
    name: LinkedIn (posts and articles, via search only)
    tier: secondary
    kind: social
    home: https://www.linkedin.com/feed/hashtag/labautomation/
    # No fetch block: linkedin.com is blocked by the network policy, most content sits behind
    # a login wall, and LinkedIn's User Agreement forbids scraping. Search engines index public
    # posts, company pages and Pulse articles, so site-restricted search is the only route.
    search:
      domains: [linkedin.com]
      queries:
        - "lab automation announces"
        - "#labautomation"
        - "liquid handling launch"
        - "self-driving lab"
        - "SLAS2027"
        - "Hamilton OR Tecan OR Beckman OR Agilent automation"
    notes: >-
      LEADS ONLY. Use posts to discover news early, then find the item's primary source (press
      release, organiser page, paper) and cite that first. A post on a company's own official
      page counts as primary for that company's own announcement; personal posts are secondary.
      Search-result dates for LinkedIn are unreliable: take the date from the post text or the
      corroborating source. Set source_id "linkedin" on items found this way so ratings show
      whether it earns its place.

  - id: wires
    name: Press-release wires
    tier: secondary
    kind: wire
    search:
      domains: [businesswire.com, prnewswire.com, globenewswire.com]
      queries:
        - "laboratory automation announces"
        - "liquid handling announces"

  - id: research
    name: Preprints and other journals
    tier: secondary
    cadence: weekly
    kind: literature
    search:
      domains: [biorxiv.org, chemrxiv.org, arxiv.org, nature.com, science.org, pubs.acs.org, pubs.rsc.org, sciencedirect.com, tandfonline.com]
      queries:
        - "automated ADME OR DMPK assay"
        - "self-driving laboratory drug discovery"
        - "autonomous experimentation robot"
        - "laboratory robotics liquid handling"
